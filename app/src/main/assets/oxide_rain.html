<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#oxideRainCanvas{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none}
</style>
</head>
<body>
<canvas id="oxideRainCanvas"></canvas>
<script>
// OXIDE HUB realistic falling rain + water droplets sliding over glass.
(function initOxideRealRain(){
const canvas=document.getElementById('oxideRainCanvas');
if(!canvas || !canvas.getContext) return;
const ctx=canvas.getContext('2d',{alpha:true});
if(!ctx) return;
let w=0,h=0,dpr=1,raf=0,last=0,raindrops=[],glassDrops=[];
const rand=(a,b)=>a+Math.random()*(b-a);
function resize(){
const rect=canvas.getBoundingClientRect();
w=Math.max(1,rect.width);h=Math.max(1,rect.height);
dpr=Math.min(window.devicePixelRatio||1,2.5);
canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
ctx.setTransform(dpr,0,0,dpr,0,0);
const count=Math.max(100,Math.min(440,Math.round(w*h/3000)));
raindrops=Array.from({length:count},()=>({x:rand(-20,w+20),y:rand(-h,h),len:rand(9,25),speed:rand(420,850),width:rand(.55,1.35),alpha:rand(.16,.48),drift:rand(-28,18)}));
glassDrops=Array.from({length:Math.max(24,Math.min(85,Math.round(w/7)))},()=>makeGlassDrop(true));
}
function makeGlassDrop(initial=false){
const r=rand(1.1,4.4);
return {x:rand(0,w),y:initial?rand(0,h):rand(-35,-5),r,vy:rand(7,25),vx:rand(-2,2),trail:rand(12,48),alpha:rand(.18,.48),wobble:rand(0,Math.PI*2)};
}
function drawRain(dt){
for(const d of raindrops){
d.y+=d.speed*dt;d.x+=d.drift*dt;
if(d.y>h+35){d.y=rand(-90,-10);d.x=rand(-10,w+10)}
if(d.x>w+25)d.x=-20;if(d.x< -25)d.x=w+20;
const g=ctx.createLinearGradient(d.x,d.y-d.len,d.x+d.drift*.035,d.y);
g.addColorStop(0,'rgba(204,235,255,0)');
g.addColorStop(.35,`rgba(202,231,255,${d.alpha*.48})`);
g.addColorStop(1,`rgba(235,248,255,${d.alpha})`);
ctx.beginPath();ctx.strokeStyle=g;ctx.lineWidth=d.width;ctx.lineCap='round';
ctx.moveTo(d.x,d.y-d.len);ctx.lineTo(d.x+d.drift*.035,d.y);ctx.stroke();
}
}
function drawGlassDrops(dt,time){
for(let i=0;i<glassDrops.length;i++){
const d=glassDrops[i];
d.y+=d.vy*dt;d.x+=Math.sin(time*.0007+d.wobble)*d.vx*dt;
if(d.y>h+50){glassDrops[i]=makeGlassDrop(false);continue}
// faint wet trail behind the bead
const trail=ctx.createLinearGradient(d.x,d.y-d.trail,d.x,d.y);
trail.addColorStop(0,'rgba(195,229,255,0)');
trail.addColorStop(1,`rgba(198,229,255,${d.alpha*.23})`);
ctx.beginPath();ctx.strokeStyle=trail;ctx.lineWidth=Math.max(.7,d.r*.55);ctx.lineCap='round';
ctx.moveTo(d.x,d.y-d.trail);ctx.lineTo(d.x,d.y);ctx.stroke();
// convex droplet with cool edge and bright reflected highlight
const rg=ctx.createRadialGradient(d.x-d.r*.36,d.y-d.r*.42,.2,d.x,d.y,d.r*1.35);
rg.addColorStop(0,`rgba(255,255,255,${d.alpha*.9})`);
rg.addColorStop(.28,`rgba(206,235,255,${d.alpha*.42})`);
rg.addColorStop(.72,`rgba(96,164,220,${d.alpha*.19})`);
rg.addColorStop(1,'rgba(225,245,255,0)');
ctx.beginPath();ctx.fillStyle=rg;ctx.ellipse(d.x,d.y,d.r*.78,d.r*1.18,0,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.strokeStyle=`rgba(231,247,255,${d.alpha*.65})`;ctx.lineWidth=.65;
ctx.ellipse(d.x-d.r*.12,d.y-d.r*.12,d.r*.48,d.r*.78,-.18,Math.PI*1.08,Math.PI*1.78);ctx.stroke();
ctx.beginPath();ctx.fillStyle=`rgba(255,255,255,${d.alpha*.8})`;ctx.ellipse(d.x-d.r*.25,d.y-d.r*.42,Math.max(.45,d.r*.15),Math.max(.7,d.r*.25),-.3,0,Math.PI*2);ctx.fill();
}
}
function frame(now){
if(document.hidden){raf=requestAnimationFrame(frame);return}
const dt=Math.min(.04,(now-last||16.7)/1000);last=now;
ctx.clearRect(0,0,w,h);
drawRain(dt);drawGlassDrops(dt,now);
raf=requestAnimationFrame(frame);
}
resize();
if('ResizeObserver' in window){new ResizeObserver(resize).observe(canvas)}else window.addEventListener('resize',resize,{passive:true});
document.addEventListener('visibilitychange',()=>{last=performance.now()});
raf=requestAnimationFrame(frame);
})();

function toggleSettingsMenu(){
const menu=document.getElementById("settingsMenu");
if(menu)menu.hidden=!menu.hidden;
}
function linkGooglePlayAccount(){
const menu=document.getElementById("settingsMenu");
if(menu)menu.hidden=true;
const status=document.getElementById("status");
if(status)status.textContent="ربط Google Play Games سيتاح بعد دمج الخدمة في تطبيق Android.";
}
</script>
</body>
</html>
