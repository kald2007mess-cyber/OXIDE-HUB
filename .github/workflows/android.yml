name: Build OXIDE HUB Native APK

on:
  workflow_dispatch:
  push:
    branches: [ main, native-app-parity ]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build native debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OXIDE-HUB-native-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
